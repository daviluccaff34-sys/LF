
name: Build LayoutForge

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build LayoutForge
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: latest
          cli: latest
          build-config: Release
          target: Android64
          android-min-sdk: 23
          use-lto: true

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: LayoutForge-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
